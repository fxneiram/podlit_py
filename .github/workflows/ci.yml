name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # Mirrors Makefile's install-deps target (minus install-ffmpeg, which this
      # runner doesn't need for imports to succeed). Needed because tests/ now
      # imports torch/TTS/pydub/opencv-python transitively via the adapters and
      # fh/ modules under test.
      - name: Install project dependencies
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install TTS==0.22.0
          pip install opencv-python
          pip install pydub
          pip install numpy==1.26.4

      - name: Install dev tools
        run: pip install ruff mypy pytest

      # Advisory for now: the legacy codebase predates these standards (see
      # references/coding-standards.md in the dev-workflow skill). Flip
      # continue-on-error to false once `ruff check .` / `ruff format --check .`
      # pass clean on the whole repo.
      - name: Ruff lint
        run: ruff check .
        continue-on-error: true

      - name: Ruff format check
        run: ruff format --check .
        continue-on-error: true

      - name: Mypy
        run: mypy .
        continue-on-error: true

      # Blocking: tolerate "no tests collected" (exit code 5) until tests/ exists,
      # but a real test failure (or error) still fails the build.
      - name: Pytest
        run: pytest || [ "$?" = "5" ]
