name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # espeak-ng is a native CLI binary (EspeakNGAdapter shells out to it), not a pip
      # package - needed so its integration test can run against the real binary in CI.
      - name: Install espeak-ng
        run: sudo apt-get update && sudo apt-get install -y espeak-ng

      # requirements-dev.txt pins production deps (torch/TTS/opencv-python/pydub/numpy, plus
      # the spacy/bangla transitive-dependency pins TTS==0.22.0 needs on Python 3.9) and dev
      # tools (ruff/mypy/pytest) together, resolved in one pass - see requirements.txt for why
      # each pin exists.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Advisory for now: the legacy codebase predates these standards (see
      # references/coding-standards.md in the dev-workflow skill). Flip
      # continue-on-error to false once `ruff check .` / `ruff format --check .`
      # pass clean on the whole repo.
      - name: Ruff lint
        run: ruff check .
        continue-on-error: true

      - name: Ruff format check
        run: ruff format --check .
        continue-on-error: true

      - name: Mypy
        run: mypy .
        continue-on-error: true

      # Blocking: tolerate "no tests collected" (exit code 5) until tests/ exists,
      # but a real test failure (or error) still fails the build.
      - name: Pytest
        run: pytest || [ "$?" = "5" ]
